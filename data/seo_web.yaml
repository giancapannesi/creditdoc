# SEO web — the keyword/content architecture for CreditDoc
# Last updated: 2026-04-26
#
# Each entry below defines an INTENT — a real searcher anxiety or qualification question
# that maps to one or more money pages. The keyword pipeline reads this file:
#   - Stage 1 uses `seed_phrases` as inputs to autocomplete + PAA expansion
#   - Stage 5 uses `primary_money_page` to route every cluster to a single owner
#   - Internal linking uses `secondary_money_pages` to wire siblings
#
# Pattern: anxiety-questions are GOLD because they reveal latent commercial intent.
# Someone asking "do I need to be profitable to get a loan" doesn't search "best small business loan"
# but they ARE a P1 lead. Their question is the point of contact.
#
# Schema:
#   pillars.<N>.intents.<intent_key>:
#     description:           one-line plain-English summary of the borrower/searcher state
#     primary_money_page:    slug of the money page that owns this intent (must exist in config.yaml)
#     secondary_money_pages: list of cross-pillar or sibling slugs to internally link to
#     seed_phrases:          5-12 natural-language seeds. Autocomplete + PAA do the multiplier.

