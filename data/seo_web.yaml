# ============================================================================
# PERSONAS — narrative case-study layer
# ============================================================================
#
# Each persona is a fictional but plausible borrower whose life touches multiple
# pillars + a city + a life-stage. Their story becomes a narrative /answers/ page
# that ranks on long-tail story queries AND wires 3-5 money pages together via
# in-context internal links.
#
# Why this matters for SEO:
#   - Generic listicles get diluted by NerdWallet/Bankrate. Narrative case-studies
#     rank for queries those sites don't bother to write for.
#   - Stories give us 1500-3000 words of natural keyword density without stuffing.
#   - Each persona becomes a "hub" that links to 4-5 money pages in context —
#     this is the topical-authority flywheel Frey Chu describes.
#   - Geo-anchored personas (Bob from Buffalo, Maria from Houston) directly
#     support the city/state geo expansion layer.
#
# Persona schema:
#   id:              short slug used in URL / internal linking
#   name:            character name
#   geo:             city + state (must align with our geo expansion eligibility)
#   life_stage:      one-line life context
#   pillars_touched: ordered list of pillar IDs the story wires together
#   money_pages_linked: money page slugs the narrative references in context
#   anxieties:       the borrower-anxiety questions the story answers
#   narrative_hook:  the headline / hook that makes someone click

personas:

  bob_buffalo_smb_owner:
    name: "Bob Carter"
    geo: "Buffalo, NY"
    life_stage: "Mid-40s. Just opened a small restaurant 8 months ago. Two teenage daughters. Bad personal credit from a 2019 medical bankruptcy. Wife works part-time."
