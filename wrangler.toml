# Rock 1 Phase R1.3 (2026-07-17) — hand-rolled worker, Astro adapter killed.
#
# Target:  Worker `creditdoc` (git-connected to giancapannesi/creditdoc).
# Runtime: worker/index.ts handles 6 dynamic routes (/api/geo, /api/search,
#          /api/email-signup, /api/origination-intake, /api/revalidate,
#          /go/[slug]). Everything else falls through to Static Assets
#          binding at dist/.
#
# Build:   `npm run build` (renderer/build_all.py → dist/, no Astro).
# Deploy:  `wrangler deploy`.
#
# Previously: main = "./dist/_worker.js/index.js" (from @astrojs/cloudflare
# adapter). Adapter killed 2026-07-17; that file no longer exists in fresh
# builds.

name = "creditdoc"
main = "./worker/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
# Route /search/* through worker first so /search/?state=X redirects can fire
# before the static /search/index.html asset is served. Everything else keeps
# the assets-first fast path (worker only invoked on 404s).
run_worker_first = ["/search", "/search/*"]

# ---------------------------------------------------------------------------
# Bindings (placeholders — fill IDs when each phase is greenlit)
# ---------------------------------------------------------------------------

# R2 bucket for lender body JSON + assets (creditdoc-assets, 35K objects).
# [[r2_buckets]]
# binding = "R2_ASSETS"
# bucket_name = "creditdoc-assets"

# KV namespace for content-version per slug + per tag (revalidation).
# [[kv_namespaces]]
# binding = "VERSIONS"
# id = "<fill-from-cloudflare-dashboard-after-creation>"

# Secrets (set via `wrangler secret put <NAME>`, never committed):
#   PUBLIC_SUPABASE_URL
#   PUBLIC_SUPABASE_ANON_KEY
#   REVALIDATE_TOKEN
