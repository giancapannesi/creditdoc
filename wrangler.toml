# CDM-REV-2026-04-29 — Cloudflare Worker config (Astro hybrid + Static Assets).
#
# Target:  Worker `creditdoc` (git-connected to giancapannesi/creditdoc).
# Adapter: @astrojs/cloudflare v12 emits SSR entry to dist/_worker.js/index.js
#          and static files to dist/. CF Workers Static Assets (GA 2025-04)
#          serves dist/ directly; SSR routes fall through to `main`.
#
# Build:   `npm run build` (Astro → dist/)
# Deploy:  `wrangler deploy` (or git auto-deploy via CF Worker Builds)

name = "creditdoc"
main = "./dist/_worker.js/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

# ---------------------------------------------------------------------------
# Bindings (placeholders — fill IDs when each phase is greenlit)
# ---------------------------------------------------------------------------

# R2 bucket for lender body JSON + assets (creditdoc-assets, 35K objects).
# [[r2_buckets]]
# binding = "R2_ASSETS"
# bucket_name = "creditdoc-assets"

# KV namespace for content-version per slug + per tag (revalidation).
# [[kv_namespaces]]
# binding = "VERSIONS"
# id = "<fill-from-cloudflare-dashboard-after-creation>"

# Secrets (set via `wrangler secret put <NAME>`, never committed):
#   PUBLIC_SUPABASE_URL
#   PUBLIC_SUPABASE_ANON_KEY
#   REVALIDATE_TOKEN
